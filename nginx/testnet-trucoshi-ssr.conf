# Host nginx reference for the staging Docker Compose project. The Docker edge
# nginx owns assets, cache policy, and SSR proxying; this host only handles TLS.
server {
    include global_errors;
    server_name testnet.trucoshi.com;

    add_header x-frame-options "DENY" always;
    add_header x-content-type-options "nosniff" always;
    add_header referrer-policy "strict-origin-when-cross-origin" always;
    add_header permissions-policy "camera=(), geolocation=(), microphone=()" always;
    add_header strict-transport-security "max-age=31536000" always;
    # Enforce this independently of the application's production SEO metadata.
    add_header x-robots-tag "noindex, nofollow, noarchive" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/testnet.trucoshi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/testnet.trucoshi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The application ships production robots.txt, so staging overrides it at
    # the hostname boundary rather than baking a testnet policy into the image.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}

server {
    if ($host = testnet.trucoshi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name testnet.trucoshi.com;
    listen 80;
    return 404; # managed by Certbot
}
