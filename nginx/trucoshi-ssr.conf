# Host nginx reference for the Docker Compose SSR deployment.
# SSL certificates and Certbot stay on the host. The Docker nginx edge serves
# assets and proxies SSR; this host nginx only terminates TLS and forwards traffic.

server {
    include global_errors;
    server_name trucoshi.com;

    add_header x-frame-options "DENY" always;
    add_header x-content-type-options "nosniff" always;
    add_header referrer-policy "strict-origin-when-cross-origin" always;
    add_header permissions-policy "camera=(), geolocation=(), microphone=()" always;
    add_header strict-transport-security "max-age=31536000" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trucoshi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trucoshi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # The host owns this fallback because it remains available when the Docker
    # edge or its SSR upstream is unavailable. Keep the upstream failure status
    # as 503 so browsers and monitoring clients can distinguish it from a page.
    error_page 502 503 504 =503 /__maintenance;

    location = /__maintenance {
        internal;
        root /var/www/trucoshi-maintenance;
        try_files /maintenance.html =500;
        expires -1;
    }

    location / {
        # Production: 127.0.0.1:3000. Staging: 127.0.0.1:3001.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    if ($host = trucoshi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name trucoshi.com;
    listen 80;
    return 404; # managed by Certbot
}
