# Docker edge nginx: serve the browser bundle locally and proxy only dynamic
# requests to the SSR process. TLS remains on the host nginx/Certbot.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    sendfile on;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/javascript;

    # Hidden Vite source maps must not be publicly downloadable.
    location ~* \.map$ {
        return 404;
    }

    # Vite/TanStack fingerprinted files are immutable by filename.
    location ~* ^/(?:assets|_build)/.+\.[a-z0-9]+$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Public audio and promotional media are not fingerprinted, so use a
    # bounded cache lifetime. Deploying a replacement under the same name can
    # take up to 30 days to reach every browser cache.
    location ~* ^/(?:sounds|images|promo)/.+\.(?:avif|gif|jpe?g|mp3|mp4|ogg|png|svg|wav|webp)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # These files are copied from public/ during the Vite build. Keep crawler
    # metadata revalidatable rather than sending clients a long-lived copy.
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Both endpoints are generated by TanStack Start handlers, not static
    # files. Their cache policy is made explicit at this edge.
    location = /site.webmanifest {
        proxy_pass http://trucoshi-client:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location = /version.json {
        proxy_pass http://trucoshi-client:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # All HTML and route handlers remain dynamic SSR responses. Do not let an
    # intermediary cache account-specific markup.
    location / {
        proxy_pass http://trucoshi-client:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
}
