<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta http-equiv="refresh" content="60" />
    <title>Trucoshi · Estamos preparando la mesa</title>
    <style>
      :root {
        color-scheme: dark;
        --felt: #15110f;
        --felt-light: #2b231d;
        --ink: #f9eefb;
        --muted: #cbbec7;
        --mate: #749424;
        --red: #94342c;
        --card: #f7efe4;
      }

      * { box-sizing: border-box; }

      body {
        align-items: center;
        background:
          radial-gradient(circle at 75% 18%, rgb(116 148 36 / 18%), transparent 27rem),
          radial-gradient(circle at 10% 92%, rgb(148 52 44 / 18%), transparent 31rem),
          linear-gradient(145deg, var(--felt-light), var(--felt) 58%);
        color: var(--ink);
        display: grid;
        font-family: Georgia, "Times New Roman", serif;
        margin: 0;
        min-height: 100svh;
        overflow: hidden;
        padding: 2rem;
      }

      main {
        margin: auto;
        max-width: 42rem;
        position: relative;
        text-align: center;
        z-index: 1;
      }

      .brand {
        font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
        font-size: clamp(2.4rem, 9vw, 4.5rem);
        font-weight: 900;
        letter-spacing: -0.07em;
        line-height: 0.9;
        margin: 0;
        text-shadow: 0 3px 0 #42251d;
      }

      .eyebrow {
        align-items: center;
        color: var(--muted);
        display: inline-flex;
        font-family: system-ui, sans-serif;
        font-size: 0.74rem;
        font-weight: 700;
        gap: 0.55rem;
        letter-spacing: 0.16em;
        margin: 1.7rem 0 0.8rem;
        text-transform: uppercase;
      }

      .pulse {
        background: var(--mate);
        border-radius: 50%;
        box-shadow: 0 0 0 0 rgb(116 148 36 / 65%);
        height: 0.56rem;
        width: 0.56rem;
        animation: pulse 2.1s infinite;
      }

      h1 {
        font-size: clamp(2rem, 6vw, 3.7rem);
        letter-spacing: -0.045em;
        line-height: 0.98;
        margin: 0;
      }

      p {
        color: var(--muted);
        font-family: system-ui, sans-serif;
        font-size: clamp(1rem, 2.3vw, 1.16rem);
        line-height: 1.6;
        margin: 1.15rem auto 0;
        max-width: 31rem;
      }

      .table {
        height: 11.5rem;
        margin: 1.8rem auto 1.2rem;
        position: relative;
        width: 16rem;
      }

      .table::before {
        background: rgb(0 0 0 / 16%);
        border: 1px solid rgb(255 255 255 / 7%);
        border-radius: 50%;
        content: "";
        inset: 1.8rem -1rem 0;
        position: absolute;
        transform: perspective(20rem) rotateX(57deg);
      }

      .card {
        align-items: center;
        background: linear-gradient(135deg, #fffdf8, var(--card));
        border: 1px solid rgb(83 48 38 / 28%);
        border-radius: 0.75rem;
        box-shadow: 0 1rem 1.8rem rgb(0 0 0 / 30%);
        color: var(--red);
        display: flex;
        font-family: Georgia, serif;
        font-size: 3.5rem;
        height: 8.2rem;
        justify-content: center;
        left: 50%;
        position: absolute;
        top: 0.45rem;
        transform-origin: 50% 95%;
        width: 5.5rem;
      }

      .card::before,
      .card::after {
        content: "7";
        font-size: 0.9rem;
        font-weight: 700;
        position: absolute;
      }

      .card::before { left: 0.55rem; top: 0.48rem; }
      .card::after { bottom: 0.48rem; right: 0.55rem; transform: rotate(180deg); }

      .card--left {
        margin-left: -5.05rem;
        transform: rotate(-13deg);
        animation: drift-left 4.8s ease-in-out infinite;
      }

      .card--right {
        color: var(--mate);
        margin-left: -0.45rem;
        transform: rotate(13deg);
        animation: drift-right 4.8s ease-in-out infinite 0.4s;
      }

      .retry {
        background: transparent;
        border: 1px solid rgb(249 238 251 / 36%);
        border-radius: 999px;
        color: var(--ink);
        display: inline-flex;
        font-family: system-ui, sans-serif;
        font-size: 0.92rem;
        font-weight: 700;
        margin-top: 1.1rem;
        padding: 0.78rem 1.25rem;
        text-decoration: none;
        transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
      }

      .retry:hover {
        background: rgb(255 255 255 / 9%);
        border-color: var(--ink);
        transform: translateY(-2px);
      }

      .footnote {
        font-size: 0.78rem;
        margin-top: 1.25rem;
        opacity: 0.76;
      }

      @keyframes drift-left {
        0%, 100% { transform: rotate(-13deg) translateY(0); }
        50% { transform: rotate(-10deg) translateY(-0.55rem); }
      }

      @keyframes drift-right {
        0%, 100% { transform: rotate(13deg) translateY(0); }
        50% { transform: rotate(10deg) translateY(-0.7rem); }
      }

      @keyframes pulse {
        70% { box-shadow: 0 0 0 0.55rem rgb(116 148 36 / 0%); }
        100% { box-shadow: 0 0 0 0 rgb(116 148 36 / 0%); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Trucoshi</p>
      <div class="table" aria-hidden="true">
        <div class="card card--left">♠</div>
        <div class="card card--right">♣</div>
      </div>
      <div class="eyebrow"><span class="pulse"></span> Mesa en preparación</div>
      <h1>Estamos barajando<br />la próxima mano.</h1>
      <p>Estamos haciendo un ajuste breve. Volvemos enseguida.</p>
      <a class="retry" href="/">Reintentar ahora</a>
      <p class="footnote">Esta página se actualizará automáticamente en un minuto.</p>
    </main>
  </body>
</html>
